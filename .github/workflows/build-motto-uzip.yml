name: Build MOTTO 3D .uZip Package

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pack-uzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Game Repo
        uses: actions/checkout@v4

      - name: Build motto3d.uzip Package
        run: |
          python3 - <<'PY'
          import gzip
          import os
          import struct
          import zlib
          import zipfile

          required_files = ("manifest.json", "app.frg", "index.html")
          missing = [path for path in required_files if not os.path.isfile(path)]
          if missing:
              raise FileNotFoundError("Required file(s) missing: " + ", ".join(missing))

          # Generate a valid 16×16 PNG icon if the repository has no icon.
          if not os.path.exists("icon.png"):
              def chunk(kind, data):
                  checksum = zlib.crc32(kind + data) & 0xFFFFFFFF
                  return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", checksum)

              pixels = b"".join(b"\x00" + (b"\x00\xe5\xff\xff" * 16) for _ in range(16))
              png = (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", 16, 16, 8, 6, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(pixels, 9))
                  + chunk(b"IEND", b"")
              )
              with open("icon.png", "wb") as icon_file:
                  icon_file.write(png)

          with open("index.html", "rb") as html_file:
              html_gz = gzip.compress(html_file.read(), compresslevel=9, mtime=0)

          with zipfile.ZipFile("motto3d.uzip", "w", compression=zipfile.ZIP_STORED) as archive:
              for path in ("manifest.json", "app.frg", "icon.png"):
                  archive.write(path, path)

              archive.writestr("index.html.gz", html_gz)

              assets_dir = "assets"
              if os.path.isdir(assets_dir):
                  for root, _, files in os.walk(assets_dir):
                      for filename in files:
                          path = os.path.join(root, filename)
                          archive.write(path, os.path.relpath(path, ".").replace("\\", "/"))

          print("Built motto3d.uzip:", os.path.getsize("motto3d.uzip"), "bytes")
          PY

      - name: Upload motto3d.uzip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motto3d-uzip-package
          path: motto3d.uzip
          if-no-files-found: error
